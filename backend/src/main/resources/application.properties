# Configuracao local. Ajuste usuario e senha conforme seu PostgreSQL.
spring.application.name=controlplus
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/controlplus}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Exibe mensagens de validacao nas respostas tratadas pela API.
